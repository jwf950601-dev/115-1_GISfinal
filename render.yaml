# Render Blueprint：一個免費的 Python web service
# 金鑰（TDX、CWA、DATABASE_URL）不寫在這裡，部署後到 Dashboard → Environment 填入。
services:
  - type: web
    name: lastmile-taipei
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TDX_CLIENT_ID
        sync: false
      - key: TDX_CLIENT_SECRET
        sync: false
      - key: CWA_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NOMINATIM_USER_AGENT
        value: lastmile-taipei-course-project
